<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Compras</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="produtos.html">Produtos</a>
    <a href="funcionarios.html">Funcionários</a>
    <a href="compras.html">Compras</a>
  </nav>

  <div class="container">
    <h2>Compras</h2>

    <form id="formCompra">
      <input type="hidden" id="compId">
      <div>
        <label>Produto ID:</label>
        <input type="number" id="compProdId" required>
      </div>
      <div>
        <label>Quantidade:</label>
        <input type="number" id="compQtd" required>
      </div>
      <div>
        <label>Tipo Pagamento:</label>
        <select id="compTipo">
          <option value="1">À vista</option>
          <option value="2">Parcelado</option>
        </select>
      </div>
      <button type="submit" id="btnCompSalvar">Salvar</button>
      <button type="button" id="btnCompCancelar" style="display:none">Cancelar</button>
    </form>

    <table>
      <thead>
        <tr><th>ID</th><th>Produto ID</th><th>Qtd</th><th>Tipo</th><th>Ações</th></tr>
      </thead>
      <tbody id="tbodyCompras"></tbody>
    </table>
  </div>

  <script src="js/compras.js"></script>
</body>
</html>
