<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Produtos</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div class="container">
    <h1>Gerenciar Produtos</h1>
    <form id="form-prod" class="card">
      <input type="hidden" id="prod-id"/>
      <label>Nome: <input type="text" id="prod-nome" required/></label>
      <label>Preço: <input type="number" id="prod-preco" step="0.01" required/></label>
      <label>Estoque: <input type="number" id="prod-estoque" required/></label>
      <button type="submit">Salvar</button>
      <button type="button" id="btn-cancel-prod" class="secondary">Cancelar</button>
    </form>

    <table>
      <thead><tr><th>Nome</th><th>Preço</th><th>Estoque</th><th>Ações</th></tr></thead>
      <tbody id="lista-prod"></tbody>
    </table>

    <a href="index.html" class="btn">Voltar</a>
  </div>
  <script src="js/api.js"></script>
  <script src="js/produtos.js"></script>
</body>
</html>
