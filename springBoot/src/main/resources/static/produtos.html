<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Produtos</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="produtos.html">Produtos</a>
    <a href="funcionarios.html">Funcionários</a>
    <a href="compras.html">Compras</a>
  </nav>

  <div class="container">
    <h2>Produtos</h2>

    <form id="formProduto">
      <input type="hidden" id="produtoCodigo">
      <div>
        <label>Nome:</label>
        <input type="text" id="produtoNome" required>
      </div>
      <div>
        <label>Valor Unitário:</label>
        <input type="number" id="produtoValor" step="0.01" required>
      </div>
      <div>
        <label>Quantidade:</label>
        <input type="number" id="produtoQuantidade" step="0.01" required>
      </div>
      <div>
        <label>Unidade de Massa?</label>
        <select id="produtoEhUnidadeMassa">
          <option value="true">Sim</option>
          <option value="false">Não</option>
        </select>
      </div>
      <button type="submit">Salvar</button>
      <button type="button" id="cancelarProduto" style="display:none">Cancelar</button>
    </form>

    <table>
      <thead><tr>
        <th>Código</th><th>Nome</th><th>Valor</th><th>Qtde</th><th>Massa?</th><th>Ações</th>
      </tr></thead>
      <tbody id="listaProdutos"></tbody>
    </table>
  </div>

  <script src="js/produtos.js"></script>
</body>
</html>
