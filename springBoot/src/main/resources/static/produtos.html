<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Produtos</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="produtos.html">Produtos</a>
    <a href="funcionarios.html">Funcionários</a>
    <a href="compras.html">Compras</a>
  </nav>

  <div class="container">
    <h2>Produtos</h2>

    <form id="formProduto">
      <input type="hidden" id="produtoId">
      <div>
        <label>Nome:</label>
        <input type="text" id="nome" required>
      </div>
      <div>
        <label>Preço:</label>
        <input type="number" id="preco" step="0.01" required>
      </div>
      <div>
        <label>Quantidade:</label>
        <input type="number" id="quantidade" step="1" required>
      </div>
      <button type="submit" id="btnSalvar">Salvar</button>
      <button type="button" id="btnCancelar" style="display:none">Cancelar</button>
    </form>

    <table>
      <thead>
        <tr><th>ID</th><th>Nome</th><th>Preço</th><th>Qtd</th><th>Ações</th></tr>
      </thead>
      <tbody id="tbodyProdutos"></tbody>
    </table>
  </div>

  <script src="js/produtos.js"></script>
</body>
</html>
