<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Funcionários</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="produtos.html">Produtos</a>
    <a href="funcionarios.html">Funcionários</a>
    <a href="compras.html">Compras</a>
  </nav>

  <div class="container">
    <h2>Funcionários</h2>

    <form id="formFuncionario">
      <input type="hidden" id="funcId">
      <div>
        <label>Nome:</label>
        <input type="text" id="funcNome" required>
      </div>
      <div>
        <label>CPF:</label>
        <input type="text" id="funcCpf" placeholder="000.000.000-00" required>
      </div>
      <div>
        <label>E-mail:</label>
        <input type="email" id="funcEmail" required>
      </div>
      <button type="submit" id="btnFuncSalvar">Salvar</button>
      <button type="button" id="btnFuncCancelar" style="display:none">Cancelar</button>
    </form>

    <table>
      <thead>
        <tr><th>ID</th><th>Nome</th><th>CPF</th><th>E-mail</th><th>Ações</th></tr>
      </thead>
      <tbody id="tbodyFuncionarios"></tbody>
    </table>
  </div>

  <script src="js/funcionarios.js"></script>
</body>
</html>
