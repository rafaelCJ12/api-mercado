<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Funcionários</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div class="container">
    <h1>Gerenciar Funcionários</h1>
    <!-- Formulário -->
    <form id="form-func" class="card">
      <input type="hidden" id="func-id"/>
      <label>Nome: <input type="text" id="func-nome" required/></label>
      <label>Email: <input type="email" id="func-email" required/></label>
      <label>Função: <input type="text" id="func-role" required/></label>
      <button type="submit">Salvar</button>
      <button type="button" id="btn-cancel" class="secondary">Cancelar</button>
    </form>

    <!-- Lista -->
    <table>
      <thead><tr><th>Nome</th><th>Email</th><th>Função</th><th>Ações</th></tr></thead>
      <tbody id="lista-func"></tbody>
    </table>

    <a href="index.html" class="btn">Voltar</a>
  </div>
  <script src="js/api.js"></script>
  <script src="js/funcionarios.js"></script>
</body>
</html>
